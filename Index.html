<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Cleaners - Booking Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURACIÓN DE TU FIREBASE (Copia esto de tu Firebase Console)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto-id",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "tu-id",
            appId: "tu-app-id"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Hacer la función accesible globalmente
        window.enviarCitaAFirebase = async (datos) => {
            try {
                await addDoc(collection(db, "transacciones"), {
                    ...datos,
                    creado: serverTimestamp(),
                    monto: 50.00, // Monto base para tus taxes
                    estado: "Pendiente"
                });
                return true;
            } catch (error) {
                console.error("Error en Firebase:", error);
                return false;
            }
        };
    </script>

    <style>
        .card-active { border: 2px solid #2563eb; background-color: #eff6ff; }
        .day-active { background-color: #10b981 !important; color: white; border-radius: 50%; }
    </style>
</head>
<body class="bg-slate-50 font-sans pb-10">

    <div class="p-6 flex justify-between items-center bg-white shadow-sm">
        <i class="fa-solid fa-bars text-xl text-slate-600"></i>
        <h1 class="text-lg font-bold text-slate-800">Elite Cleaners</h1>
        <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
            <i class="fa-solid fa-user text-blue-600"></i>
        </div>
    </div>

    <div class="max-w-md mx-auto p-4">
        
        <div class="bg-blue-600 rounded-2xl p-6 text-white flex justify-between items-center mb-6 shadow-lg shadow-blue-200">
            <div>
                <h2 class="text-2xl font-bold">40% off</h2>
                <p class="text-blue-100 text-sm">On first cleaning service</p>
            </div>
            <i class="fa-solid fa-wand-magic-sparkles text-4xl opacity-50"></i>
        </div>

        <h3 class="font-bold text-slate-700 mb-4">Selecciona el servicio</h3>
        <div class="grid grid-cols-3 gap-3 mb-8">
            <div onclick="selectPack(this, '4 Bedrooms')" class="bg-white p-4 rounded-xl shadow-sm text-center cursor-pointer border-2 border-transparent">
                <i class="fa-solid fa-house-user text-blue-500 text-xl mb-2"></i>
                <p class="text-[10px] font-bold">4 Rooms</p>
            </div>
            <div onclick="selectPack(this, '3 Bedrooms')" class="bg-white p-4 rounded-xl shadow-sm text-center cursor-pointer border-2 border-transparent card-active">
                <i class="fa-solid fa-house text-blue-500 text-xl mb-2"></i>
                <p class="text-[10px] font-bold">3 Rooms</p>
            </div>
            <div onclick="selectPack(this, '2 Bedrooms')" class="bg-white p-4 rounded-xl shadow-sm text-center cursor-pointer border-2 border-transparent">
                <i class="fa-solid fa-bed text-blue-500 text-xl mb-2"></i>
                <p class="text-[10px] font-bold">2 Rooms</p>
            </div>
        </div>

        <div class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm">
                <label class="text-[10px] text-slate-400 font-bold uppercase">Customer Info</label>
                <input type="text" id="nombre" placeholder="Nombre completo" class="w-full mt-2 outline-none text-slate-700">
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm">
                <label class="text-[10px] text-slate-400 font-bold uppercase">Address</label>
                <input type="text" id="direccion" placeholder="Calle, Ciudad, ZIP" class="w-full mt-2 outline-none text-slate-700">
            </div>
        </div>

        <button id="btnProceed" onclick="procesarTodo()" class="w-full bg-blue-600 text-white font-bold p-5 rounded-2xl mt-8 shadow-lg shadow-blue-200 active:scale-95 transition-all">
            PROCEED
        </button>
    </div>

    <script>
        let paquete = "3 Bedrooms";

        function selectPack(el, name) {
            document.querySelectorAll('.grid div').forEach(d => d.classList.remove('card-active'));
            el.classList.add('card-active');
            paquete = name;
        }

        async function procesarTodo() {
            const nombre = document.getElementById('nombre').value;
            const dir = document.getElementById('direccion').value;
            const btn = document.getElementById('btnProceed');

            if(!nombre || !dir) {
                alert("Completa los datos, por favor.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "SAVING...";

            // 1. Guardar en Firebase (Para tus Taxes)
            const exito = await window.enviarCitaAFirebase({
                cliente: nombre,
                direccion: dir,
                paquete: paquete,
                fecha_reserva: "Oct 3, 2026"
            });

            // 2. Abrir WhatsApp
            if(exito) {
                const msg = `*NEW REQUEST*%0A*Name:* ${nombre}%0A*Pack:* ${paquete}%0A*Address:* ${dir}`;
                window.open(`https://wa.me/19253362884?text=${msg}`, '_blank');
                btn.innerText = "PROCEED";
                btn.disabled = false;
            } else {
                alert("Error al guardar en la nube. Verifica tu Firebase Config.");
                btn.innerText = "PROCEED";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
